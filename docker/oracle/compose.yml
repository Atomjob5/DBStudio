services:
  oracle:
    image: gvenzl/oracle-free:23.26.2
    container_name: dbstudio-oracle
    ports:
      - "127.0.0.1:15211:1521"
    environment:
      ORACLE_PASSWORD: DbStudio123
    shm_size: 1gb
    volumes:
      - dbstudio-oracle-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d:ro
      - ./bfiles:/opt/oracle/dbstudio-bfiles:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

volumes:
  dbstudio-oracle-data:
    name: dbstudio-oracle-data
